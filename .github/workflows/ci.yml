name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  контракт:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e . pytest ruff

      - name: ruff
        run: ruff check campus_contracts tests

      - name: тесты
        run: pytest -q
